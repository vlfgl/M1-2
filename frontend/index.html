<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 재무 비서</title>
  <link rel="stylesheet" href="style.css" />
  <!-- API 서버 주소: 로컬은 config.js 기본값, Vercel은 빌드 시 API_BASE_URL로 생성 -->
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">₩</span>
      <div>
        <h1>나만의 재무 비서</h1>
        <p class="sub">내 지출 데이터를 아는 AI</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="serverStatus" class="status status-pending" role="status">서버 연결 중…</span>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="다크 모드 전환">🌙</button>
    </div>
  </header>

  <div id="coldStartBanner" class="banner hidden" role="alert">
    무료 서버가 잠들어 있어 깨우는 중이에요. 첫 연결은 최대 1분 정도 걸릴 수 있어요.
  </div>

  <main class="layout">
    <!-- 대화 기록 -->
    <aside class="panel history">
      <div class="panel-head">
        <h2>대화 기록</h2>
        <button id="newChatBtn" class="btn btn-small" type="button">+ 새 대화</button>
      </div>
      <ul id="conversationList" class="conv-list"></ul>
      <p id="conversationEmpty" class="muted small hidden">저장된 대화가 없어요.</p>
    </aside>

    <!-- 채팅 / 데이터 관리 -->
    <section class="panel center">
      <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="chat" aria-selected="true">AI 채팅</button>
        <button class="tab" role="tab" data-tab="data" aria-selected="false">데이터 관리</button>
      </nav>

      <div id="tab-chat" class="tab-body">
        <div id="chatMessages" class="messages" aria-live="polite">
          <div class="welcome">
            <p class="welcome-title">무엇이 궁금하세요?</p>
            <div class="chips">
              <button class="chip" type="button">이번 달 지출 어때?</button>
              <button class="chip" type="button">가장 많이 쓴 때는 언제야?</button>
              <button class="chip" type="button">식비를 줄이려면 어떻게 해야 할까?</button>
              <button class="chip" type="button">월별 지출 추세를 분석해줘</button>
            </div>
          </div>
        </div>
        <form id="chatForm" class="chat-form">
          <textarea id="chatInput" rows="1" maxlength="2000" placeholder="지출에 대해 물어보세요 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
          <button id="chatSend" class="btn" type="submit">전송</button>
        </form>
      </div>

      <div id="tab-data" class="tab-body hidden">
        <form id="dataForm" class="data-form">
          <input type="hidden" id="dataId" />
          <label>날짜<input type="date" id="dataDate" required /></label>
          <label>금액(원)<input type="number" id="dataValue" min="1" max="100000000" step="1" required placeholder="12000" /></label>
          <label>카테고리
            <select id="dataCategory">
              <option>식비</option><option>카페</option><option>교통</option><option>쇼핑</option>
              <option>주거/통신</option><option>구독</option><option>문화/여가</option><option>의료</option><option>기타</option>
            </select>
          </label>
          <label class="grow">메모<input type="text" id="dataMemo" maxlength="180" placeholder="점심 식사" /></label>
          <div class="form-actions">
            <button id="dataSubmit" class="btn" type="submit">추가</button>
            <button id="dataCancel" class="btn btn-ghost hidden" type="button">취소</button>
          </div>
        </form>
        <p id="dataMessage" class="form-msg" role="status"></p>

        <div class="data-toolbar">
          <label>월 선택 <input type="month" id="dataMonth" /></label>
          <span id="dataCount" class="muted small"></span>
          <button id="exportCsv" class="btn btn-ghost btn-small" type="button">CSV 내보내기</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>날짜</th><th class="num">금액</th><th>카테고리</th><th>메모</th><th></th></tr></thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 데이터 요약 -->
    <aside class="panel summary">
      <div class="panel-head">
        <h2>데이터 요약</h2>
        <button id="refreshSummary" class="icon-btn small" type="button" aria-label="요약 새로고침">↻</button>
      </div>
      <div id="summaryBody" class="summary-body">
        <p class="muted small">불러오는 중…</p>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
